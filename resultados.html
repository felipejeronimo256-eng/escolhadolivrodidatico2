<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados — Escolha do Livro Didático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0B3C6B; --blue-700:#12518C; --blue-600:#1568B0;
    --blue-200:#BFE0FA; --blue-100:#DCEEFB; --blue-050:#F2F9FF;
    --white:#FFFFFF; --amber:#F2A93B; --ink:#1F2937; --slate:#5B6B7C;
    --line:#D8E7F5; --ftd:#1568B0; --atica:#C9722A; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--blue-200) 0%,var(--blue-050) 42%,var(--white) 75%);min-height:100vh;}
  h1,h2,h3,h4{font-family:'Manrope',sans-serif;color:var(--blue-900);margin:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;gap:16px;max-width:1000px;margin:0 auto;}
  .logo-slot{width:76px;height:76px;flex:0 0 auto;border-radius:12px;border:1.5px dashed var(--blue-200);
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);overflow:hidden;}
  .logo-slot img{width:100%;height:100%;object-fit:contain;}
  .logo-slot span{font-size:11px;color:var(--slate);text-align:center;line-height:1.3;padding:4px;}
  .titlewrap{text-align:center;flex:1;}
  .titlewrap h1{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .titlewrap p{margin:2px 0 0;color:var(--slate);font-size:13px;}
  nav.linkbar{display:flex;justify-content:center;max-width:1000px;margin:6px auto 0;padding:0 24px;}
  .link-btn{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;
    border:1.5px solid var(--blue-200);background:var(--white);color:var(--blue-700);text-decoration:none;transition:all .15s ease;}
  .link-btn:hover{background:var(--blue-700);border-color:var(--blue-700);color:var(--white);}
  main{max-width:760px;margin:0 auto;padding:24px 20px 80px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;
    box-shadow:0 2px 10px rgba(11,60,107,.05);}
  .result-card h3{font-size:16px;margin-bottom:2px;}
  .result-sub{font-size:12px;color:var(--slate);margin-bottom:14px;}
  .bar-row{margin-bottom:10px;}
  .bar-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;}
  .bar-track{height:10px;border-radius:6px;background:var(--blue-100);overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .4s ease;}
  .rank-block{margin-bottom:14px;}
  .rank-block-label{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .cat-section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
  .cat-section-title h2{font-size:17px;}
  .cat-section-title .count{font-size:12px;color:var(--slate);background:var(--blue-100);padding:3px 10px;border-radius:999px;}
  .empty-note{font-size:13px;color:var(--slate);text-align:center;padding:20px;}
  .refresh-note{font-size:12px;color:var(--slate);text-align:center;margin-bottom:16px;}
  .cat3-title{border-left:3px solid var(--amber);padding-left:10px;}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;text-align:center;}
  footer p{font-size:11px;color:var(--slate);}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-slot" id="logoLeft">
    <img src="imagens/01.png" alt="Logotipo da instituição"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'+ logo-esquerda.png<br>nesta pasta'}))">
  </div>
  <div class="titlewrap">
    <h1>Escolha do Livro Didático</h1>
    <p>Resultados em tempo real</p>
  </div>
  <div class="logo-slot" id="logoRight">
    <img src="imagens/02.png" alt="Logotipo da secretaria"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'+ logo-direita.png<br>nesta pasta'}))">
  </div>
</header>

<nav class="linkbar">
  <a class="link-btn" href="votacao.html">← Ir para cadastro e votação</a>
</nav>

<main id="app"></main>

<footer>
  <p>Os percentuais são calculados a partir dos votos registrados na página de votação, armazenados de forma compartilhada.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
// ---------- Firebase ----------
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// Mesmo cache local usado em votacao.html: a página de resultados também
// funciona offline, exibindo os últimos dados sincronizados.
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  if(err.code === 'failed-precondition'){
    console.warn('Persistência offline não ativada: há outra aba deste site aberta.');
  } else if(err.code === 'unimplemented'){
    console.warn('Este navegador não suporta persistência offline do Firestore.');
  }
});

const PUBLISHERS = ['FTD','Ática'];
const CAT_COMPONENTS = {
  1: ['Língua Portuguesa','Matemática','Ciências','História','Geografia','Arte'],
  2: ['Língua Portuguesa','Matemática','Ciências','História','Geografia','Arte']
};
const CAT3_LABEL = 'Língua Estrangeira';

// ---------- storage helpers (Firestore, shared with votacao.html) ----------
// Mesmo mapeamento de chave -> documento usado em votacao.html:
// 'voto:12345678900' -> coleção 'voto', documento '12345678900'.
function keyToRef(key){
  const [colecao, ...resto] = key.split(':');
  const docId = resto.join(':') || '_default';
  return db.collection(colecao).doc(docId);
}
async function getVal(key, shared=true){
  try{
    const snap = await keyToRef(key).get();
    return snap.exists ? snap.data().value : null;
  }catch(e){ console.error('getVal falhou', key, e); return null; }
}
async function listKeys(prefix, shared=true){
  try{
    const colecao = prefix.replace(/:$/,'');
    const snap = await db.collection(colecao).get();
    return snap.docs.map(d => `${colecao}:${d.id}`);
  }catch(e){ console.error('listKeys falhou', prefix, e); return []; }
}

// ---------- aggregation ----------
async function computeResults(){
  const keys = await listKeys('voto:');
  const votos = [];
  for(const k of keys){
    const v = await getVal(k);
    if(v) votos.push(v);
  }
  const agg = { 1:{}, 2:{}, cat3:{FTD:{op1:0,op2:0},'Ática':{op1:0,op2:0}}, totals:{1:0,2:0,geral:votos.length} };
  CAT_COMPONENTS[1].forEach(c=> agg[1][c] = {FTD:{op1:0,op2:0},'Ática':{op1:0,op2:0}});
  CAT_COMPONENTS[2].forEach(c=> agg[2][c] = {FTD:{op1:0,op2:0},'Ática':{op1:0,op2:0}});

  votos.forEach(v=>{
    const gKey = (String(v.categoriaGrupo)==='1') ? 1 : 2;
    agg.totals[gKey]++;
    Object.entries(v.votosCategoria||{}).forEach(([comp,sel])=>{
      if(agg[gKey][comp]){
        if(sel.op1) agg[gKey][comp][sel.op1].op1++;
        if(sel.op2) agg[gKey][comp][sel.op2].op2++;
      }
    });
    if(v.votosCat3){
      if(v.votosCat3.op1) agg.cat3[v.votosCat3.op1].op1++;
      if(v.votosCat3.op2) agg.cat3[v.votosCat3.op2].op2++;
    }
  });
  return agg;
}

function pct(n, total){ return total>0 ? Math.round((n/total)*100) : 0; }

function barBlockHTML(counts, total){
  return ['op1','op2'].map(rank=>`
    <div class="rank-block">
      <div class="rank-block-label">${rank==='op1'?'1ª opção':'2ª opção'}</div>
      ${PUBLISHERS.map(pub=>{
        const p = pct(counts[pub][rank], total);
        const color = pub==='FTD' ? 'var(--ftd)' : 'var(--atica)';
        return `
          <div class="bar-row">
            <div class="bar-top"><span>${pub}</span><span>${p}%</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${color};"></div></div>
          </div>`;
      }).join('')}
    </div>
  `).join('');
}

async function renderResultados(){
  const app = document.getElementById('app');
  const agg = await computeResults();

  let html = `<p class="refresh-note">Atualizado automaticamente · ${agg.totals.geral} professor(es) votaram até agora</p>`;

  [1,2].forEach(g=>{
    const total = agg.totals[g];
    html += `<div class="cat-section-title"><h2>Categoria ${g} — ${g===1?'1º e 2º anos':'3º, 4º e 5º anos'}</h2><span class="count">${total} votante(s)</span></div>`;
    if(total===0){
      html += `<div class="card empty-note">Ainda não há votos registrados nesta categoria.</div>`;
    } else {
      CAT_COMPONENTS[g].forEach(comp=>{
        html += `<div class="card result-card">
          <h3>${comp}</h3>
          <p class="result-sub">Percentual sobre ${total} votante(s) da categoria ${g}</p>
          ${barBlockHTML(agg[g][comp], total)}
        </div>`;
      });
    }
  });

  html += `<div class="cat-section-title cat3-title"><h2>Categoria 3 — ${CAT3_LABEL}</h2><span class="count">${agg.totals.geral} votante(s)</span></div>`;
  if(agg.totals.geral===0){
    html += `<div class="card empty-note">Ainda não há votos registrados.</div>`;
  } else {
    html += `<div class="card result-card">
      <p class="result-sub">Percentual sobre o total geral de professores votantes (1º ao 5º ano)</p>
      ${barBlockHTML(agg.cat3, agg.totals.geral)}
    </div>`;
  }

  app.innerHTML = html;
}

renderResultados();
setInterval(renderResultados, 6000);
</script>
</body>
</html>
