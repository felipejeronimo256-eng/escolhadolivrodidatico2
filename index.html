<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Votação — Escolha do Livro Didático</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --blue-900:#0B3C6B;
  --blue-700:#12518C;
  --blue-600:#1568B0;
  --blue-200:#BFE0FA;
  --blue-100:#DCEEFB;
  --blue-050:#F2F9FF;
  --white:#FFFFFF;
  --amber:#F2A93B;
  --ink:#1F2937;
  --slate:#5B6B7C;
  --line:#D8E7F5;
  --ftd:#1568B0;
  --atica:#C9722A;
  --radius:14px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:
    linear-gradient(
      180deg,
      var(--blue-200) 0%,
      var(--blue-050) 42%,
      var(--white) 75%
    );
  min-height:100vh;
}

h1,h2,h3,h4{
  font-family:'Manrope',sans-serif;
  color:var(--blue-900);
  margin:0;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 24px;
  gap:16px;
  max-width:1000px;
  margin:0 auto;
}

.logo-slot{
  width:76px;
  height:76px;
  flex:0 0 auto;
  border-radius:12px;
  border:1.5px dashed var(--blue-200);
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.6);
  overflow:hidden;
}

.logo-slot img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.logo-slot span{
  font-size:11px;
  color:var(--slate);
  text-align:center;
  line-height:1.3;
  padding:4px;
}

.titlewrap{
  text-align:center;
  flex:1;
}

.titlewrap h1{
  font-size:22px;
  font-weight:800;
}

.titlewrap p{
  margin:2px 0 0;
  color:var(--slate);
  font-size:13px;
}

nav.linkbar{
  display:flex;
  justify-content:center;
  max-width:1000px;
  margin:6px auto 0;
  padding:0 24px;
}

.link-btn{
  font-family:'Manrope',sans-serif;
  font-weight:700;
  font-size:13px;
  padding:9px 18px;
  border-radius:999px;
  border:1.5px solid var(--blue-200);
  background:var(--white);
  color:var(--blue-700);
  text-decoration:none;
  transition:all .15s ease;
}

.link-btn:hover{
  background:var(--blue-700);
  border-color:var(--blue-700);
  color:var(--white);
}

main{
  max-width:760px;
  margin:0 auto;
  padding:24px 20px 80px;
}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(11,60,107,.05);
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--blue-900);
  margin-bottom:6px;
}

input[type=text],
select{
  width:100%;
  padding:11px 13px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-family:'Inter',sans-serif;
  font-size:14px;
  margin-bottom:16px;
  background:var(--blue-050);
  color:var(--ink);
}

input[type=text]:focus,
select:focus{
  outline:2px solid var(--blue-600);
  outline-offset:1px;
  background:var(--white);
}

.hint{
  font-size:12px;
  color:var(--slate);
  margin-top:-12px;
  margin-bottom:16px;
}

.warn{
  font-size:13px;
  color:#B23B3B;
  margin-top:-10px;
  margin-bottom:14px;
}

.info{
  font-size:13px;
  color:var(--blue-700);
  background:var(--blue-050);
  border:1px solid var(--blue-200);
  border-radius:10px;
  padding:12px;
  margin-bottom:16px;
}

.radio-group{
  display:flex;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.radio-pill{
  flex:1 1 220px;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  cursor:pointer;
  transition:all .15s ease;
}

.radio-pill.selected{
  border-color:var(--blue-600);
  background:var(--blue-050);
}

.radio-pill b{
  display:block;
  font-size:14px;
  color:var(--blue-900);
}

.radio-pill span{
  font-size:12px;
  color:var(--slate);
}

.comp-card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  background:var(--blue-050);
}

.comp-card h4{
  font-size:15px;
  margin-bottom:10px;
}

.rank-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.rank-label{
  font-size:12px;
  font-weight:700;
  color:var(--slate);
  width:66px;
  flex:0 0 auto;
}

.pub-btn{
  flex:1;
  padding:9px 8px;
  border-radius:9px;
  border:1.5px solid var(--line);
  background:var(--white);
  font-family:'Manrope',sans-serif;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  color:var(--ink);
  position:relative;
  transition:transform .12s ease,border-color .12s ease;
}

.pub-btn:hover{
  border-color:var(--blue-600);
}

.pub-btn.on{
  color:var(--white);
  border-color:transparent;
  transform:scale(1.03);
}

.pub-btn[data-pub="FTD - A Conquista"].on{
  background:var(--ftd);
}

.pub-btn[data-pub="Ática - Ápis"].on{
  background:var(--atica);
}

.pub-btn.on::after{
  content:'✓';
  margin-left:6px;
}

.cat3-card{
  border-color:var(--amber);
  background:#FFF8EC;
}

.btn-primary{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  background:var(--blue-700);
  color:var(--white);
  font-family:'Manrope',sans-serif;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.btn-primary:disabled{
  background:#A9BCCB;
  cursor:not-allowed;
}

.btn-primary:hover:not(:disabled){
  background:var(--blue-900);
}

.success-box{
  text-align:center;
  padding:30px 20px;
}

.stamp{
  font-size:44px;
  margin-bottom:10px;
}

.error-box{
  background:#FFF4F4;
  border:1px solid #E9B4B4;
  color:#8E2D2D;
  border-radius:10px;
  padding:15px;
  margin-top:15px;
  font-size:13px;
  display:none;
}

footer{
  max-width:760px;
  margin:0 auto;
  padding:0 20px 40px;
  text-align:center;
}

footer p{
  font-size:11px;
  color:var(--slate);
}

.loading{
  text-align:center;
  color:var(--slate);
  padding:30px;
}

@media(max-width:600px){

  .topbar{
    padding:14px 12px;
    gap:8px;
  }

  .logo-slot{
    width:58px;
    height:58px;
  }

  .titlewrap h1{
    font-size:17px;
  }

  .titlewrap p{
    font-size:11px;
  }

  main{
    padding:18px 12px 60px;
  }

  .card{
    padding:17px;
  }

  .rank-row{
    flex-wrap:wrap;
  }

  .rank-label{
    width:100%;
  }

}

</style>
</head>

<!-- ============================================================
     FIREBASE
     ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="config.js"></script>


<script>

'use strict';

/* ============================================================
   INICIALIZA FIREBASE
   ============================================================ */

let db;

try{

  firebase.initializeApp(firebaseConfig);

  db = firebase.firestore();

  console.log('Firebase inicializado com sucesso.');

}catch(error){

  console.error('Erro ao inicializar Firebase:', error);

}


/* ============================================================
   EDITORAS
   ============================================================ */

const PUBLISHERS = [
  'FTD - A Conquista',
  'Ática - Ápis'
];


/* ============================================================
   CATEGORIA 1
   ============================================================ */

const CAT_COMPONENTS = {

  1: [
    'Língua Portuguesa',
    'Matemática',
    'Inter. de Ciên. da Natur. Hist. e Geo.',
    'Educ. Fís.',
    'Educ. Digit. e Midiát.',
    'Arte'
  ],

  2: [
    'Língua Portuguesa',
    'Matemática',
    'Prod. de texto.',
    'História',
    'Geografia',
    'Arte',
    'Hist. e Geo. - Região NE. (Regionalizado)',
    'Educ. Fís.',
    'Educ. Digit. e Midiát.'
  ]

};


/* ============================================================
   CATEGORIA 3
   ============================================================ */

const CAT3_LABELS = [

  'Língua Inglesa 1º e 2º anos',

  'Língua Espanhola 1º e 2º anos',

  'Língua Inglesa 3º ao 5º anos',

  'Língua Espanhola 3º ao 5º anos'

];


/* ============================================================
   ESCOLAS
   ============================================================ */

const SCHOOLS = [

  'Centro de Educação Infantil Afrânio Samuel',
  'Centro de Educação Infantil Monte Belo',
  'Centro Social Educacional Almir Tavares',
  'Creche Casulo Tia Luiza',
  'Creche Clotilde Wanderley',
  'Creche Maria de Lourdes Monteiro Pontes',
  'Escola Mun. Alfredo Gomes',
  'Escola Mun. Comunidade Cristã',
  'Escola Mun. Dr Benjamin Azevedo',
  'Escola Mun. Jacy Estelita',
  'Escola Mun. José Rufino',
  'Escola Mun. Juvenato Padre Guedes',
  'Escola Mun. Luiz Maranhão',
  'Escola Mun. Luiza Coutinho',
  'Escola Mun. Manoel de Oliveira',
  'Escola Mun. Maria de Lourdes Pedrosa',
  'Escola Mun. Maria José Monteiro',
  'Escola Mun. Napoleão Xavier de Morais',
  'Escola Mun. Urbano Ramos',
  'Grupo Escolar Carlos Pessoa Guerra'

];


/* ============================================================
   ESTADO DO FORMULÁRIO
   ============================================================ */

let formState;

function resetFormState(){

  formState = {

    nome:'',
    cpf:'',
    escola:'',
    grupo:null,

    votos:{},

    votosCat3:{},

    jaVotou:false,

    verificandoCPF:false

  };

}


/* ============================================================
   CPF
   ============================================================ */

function onlyDigits(value){

  return String(value || '')
    .replace(/\D/g,'');

}


function formatCPF(digits){

  digits = onlyDigits(digits).slice(0,11);

  let out = digits;

  if(digits.length > 9){

    out = digits.replace(
      /(\d{3})(\d{3})(\d{3})(\d{1,2})/,
      '$1.$2.$3-$4'
    );

  }

  else if(digits.length > 6){

    out = digits.replace(
      /(\d{3})(\d{3})(\d{1,3})/,
      '$1.$2.$3'
    );

  }

  else if(digits.length > 3){

    out = digits.replace(
      /(\d{3})(\d{1,3})/,
      '$1.$2'
    );

  }

  return out;

}


function validaCPF(digits){

  digits = onlyDigits(digits);

  if(
    digits.length !== 11 ||
    /^(\d)\1{10}$/.test(digits)
  ){

    return false;

  }

  let soma = 0;

  for(let i=0;i<9;i++){

    soma +=
      parseInt(digits.charAt(i),10) *
      (10-i);

  }

  let resto = (soma * 10) % 11;

  if(resto === 10 || resto === 11){

    resto = 0;

  }

  if(resto !== parseInt(digits.charAt(9),10)){

    return false;

  }

  soma = 0;

  for(let i=0;i<10;i++){

    soma +=
      parseInt(digits.charAt(i),10) *
      (11-i);

  }

  resto = (soma * 10) % 11;

  if(resto === 10 || resto === 11){

    resto = 0;

  }

  return resto === parseInt(digits.charAt(10),10);

}


/* ============================================================
   SHA-256
   ============================================================ */

async function cpfId(cpf){

  const texto = onlyDigits(cpf);

  if(!texto){

    throw new Error('CPF não informado.');

  }

  if(!window.crypto || !window.crypto.subtle){

    throw new Error(
      'O navegador não disponibilizou criptografia segura.'
    );

  }

  const encoder = new TextEncoder();

  const data = encoder.encode(texto);

  const hashBuffer =
    await crypto.subtle.digest(
      'SHA-256',
      data
    );

  const hashArray =
    Array.from(
      new Uint8Array(hashBuffer)
    );

  return hashArray
    .map(
      byte =>
        byte
          .toString(16)
          .padStart(2,'0')
    )
    .join('');

}


/* ============================================================
   ESCOLAS
   ============================================================ */

function getSchools(){

  return SCHOOLS.slice();

}


/* ============================================================
   CRIA ESTRUTURA DE VOTOS
   ============================================================ */

function createCategoryVotes(group){

  const result = {};

  CAT_COMPONENTS[group].forEach(comp=>{

    result[comp] = {

      op1:null,
      op2:null

    };

  });

  return result;

}


function createCat3Votes(){

  const result = {};

  CAT3_LABELS.forEach(comp=>{

    result[comp] = {

      op1:null,
      op2:null

    };

  });

  return result;

}


/* ============================================================
   VERIFICA SE CPF JÁ VOTOU
   ============================================================ */

async function checkCpfExistente(){

  const warn =
    document.getElementById('cpfWarn');

  if(!warn){

    return;

  }

  const cpf =
    onlyDigits(formState.cpf);

  if(cpf.length !== 11){

    warn.style.display='none';

    formState.jaVotou=false;

    updateSubmitArea();

    return;

  }

  if(!validaCPF(cpf)){

    warn.textContent =
      'CPF inválido. Confira os números digitados.';

    warn.style.display='block';

    formState.jaVotou=false;

    updateSubmitArea();

    return;

  }

  try{

    formState.verificandoCPF=true;

    warn.textContent='Verificando CPF...';

    warn.style.display='block';

    updateSubmitArea();

    const voteId =
      await cpfId(cpf);

    const ref =
      db
        .collection('votos')
        .doc(voteId);

    const snap =
      await ref.get();

    if(snap.exists){

      warn.textContent =
        'Este CPF já possui um voto registrado no sistema.';

      warn.style.display='block';

      formState.jaVotou=true;

    }else{

      warn.textContent =
        'CPF disponível para votação.';

      warn.style.display='block';

      warn.style.color='#1568B0';

      formState.jaVotou=false;

    }

  }catch(error){

    console.error(
      'Erro ao verificar CPF:',
      error
    );

    warn.textContent =
      'Não foi possível verificar o CPF agora.';

    warn.style.display='block';

    formState.jaVotou=false;

  }finally{

    formState.verificandoCPF=false;

    updateSubmitArea();

  }

}


/* ============================================================
   RENDER FORMULÁRIO
   ============================================================ */

async function renderVotar(){

  resetFormState();

  const app =
    document.getElementById('app');

  const schools =
    getSchools();

  app.innerHTML = `

    <div class="card">

      <h3 style="margin-bottom:16px;">
        Dados do professor
      </h3>

      <label for="fNome">
        Nome completo
      </label>

      <input
        type="text"
        id="fNome"
        placeholder="Digite seu nome"
        autocomplete="name"
      >

      <label for="fCpf">
        CPF
      </label>

      <input
        type="text"
        id="fCpf"
        placeholder="000.000.000-00"
        inputmode="numeric"
        autocomplete="off"
        maxlength="14"
      >

      <div
        class="warn"
        id="cpfWarn"
        style="display:none;"
      ></div>

      <label for="fEscola">
        Escola em que trabalha
      </label>

      <select id="fEscola">

        <option value="">
          Selecione a escola
        </option>

        ${schools.map(s=>`

          <option value="${escapeHTML(s)}">
            ${escapeHTML(s)}
          </option>

        `).join('')}

      </select>

    </div>


    <div class="card">

      <h3 style="margin-bottom:6px;">
        Categoria de votação
      </h3>

      <p class="hint" style="margin-top:2px;">

        Escolha de acordo com as turmas em que leciona.
        Quem vota na Categoria 1 não vota na Categoria 2.

      </p>

      <div class="radio-group">

        <div
          class="radio-pill"
          data-grupo="1"
        >

          <b>Categoria 1</b>

          <span>
            1º e 2º anos
          </span>

        </div>


        <div
          class="radio-pill"
          data-grupo="2"
        >

          <b>Categoria 2</b>

          <span>
            3º, 4º e 5º anos
          </span>

        </div>

      </div>

    </div>


    <div id="votacaoArea"></div>

    <div id="submitArea"></div>

  `;


  /* Nome */

  document
    .getElementById('fNome')
    .addEventListener(
      'input',
      event => {

        formState.nome =
          event.target.value;

        updateSubmitArea();

      }
    );


  /* CPF */

  document
    .getElementById('fCpf')
    .addEventListener(
      'input',
      event => {

        const digits =
          onlyDigits(
            event.target.value
          );

        formState.cpf=digits;

        event.target.value =
          formatCPF(digits);

        formState.jaVotou=false;

        const warn =
          document.getElementById('cpfWarn');

        if(warn){

          warn.style.display='none';

        }

        updateSubmitArea();

      }
    );


  document
    .getElementById('fCpf')
    .addEventListener(
      'blur',
      checkCpfExistente
    );


  /* Escola */

  document
    .getElementById('fEscola')
    .addEventListener(
      'change',
      event => {

        formState.escola =
          event.target.value;

        updateSubmitArea();

      }
    );


  /* Categoria */

  document
    .querySelectorAll('.radio-pill')
    .forEach(pill=>{

      pill.addEventListener(
        'click',
        ()=>{

          formState.grupo =
            pill.dataset.grupo;

          formState.votos =
            createCategoryVotes(
              formState.grupo
            );

          formState.votosCat3 =
            createCat3Votes();

          document
            .querySelectorAll('.radio-pill')
            .forEach(p=>
              p.classList.remove(
                'selected'
              )
            );

          pill.classList.add(
            'selected'
          );

          renderVotacaoArea();

        }
      );

    });


  renderVotacaoArea();

}


/* ============================================================
   ESCAPA HTML
   ============================================================ */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* ============================================================
   CARD DE COMPONENTE
   ============================================================ */

function compCardHTML(
  label,
  sel,
  isCat3=false
){

  const compAttr =
    isCat3
      ? `data-cat3="1" data-comp="${escapeHTML(label)}"`
      : `data-comp="${escapeHTML(label)}"`;

  return `

    <div class="comp-card">

      <h4>
        ${escapeHTML(label)}
      </h4>

      ${['op1','op2'].map(rank=>`

        <div class="rank-row">

          <span class="rank-label">

            ${
              rank==='op1'
                ? '1ª opção'
                : '2ª opção'
            }

          </span>

          ${PUBLISHERS.map(pub=>`

            <button
              type="button"
              class="pub-btn ${
                sel &&
                sel[rank]===pub
                  ? 'on'
                  : ''
              }"
              ${compAttr}
              data-rank="${rank}"
              data-pub="${escapeHTML(pub)}"
            >

              ${escapeHTML(pub)}

            </button>

          `).join('')}

        </div>

      `).join('')}

    </div>

  `;

}


/* ============================================================
   ÁREA DE VOTAÇÃO
   ============================================================ */

function renderVotacaoArea(){

  const area =
    document.getElementById(
      'votacaoArea'
    );

  if(!area){

    return;

  }

  if(!formState.grupo){

    area.innerHTML='';

    updateSubmitArea();

    return;

  }


  const comps =
    CAT_COMPONENTS[
      formState.grupo
    ];


  area.innerHTML = `

    <div class="card">

      <h3 style="margin-bottom:6px;">

        Categoria ${formState.grupo}
        — por componente curricular

      </h3>

      <p class="hint" style="margin-top:2px;">

        Para cada componente, clique na editora
        escolhida para a 1ª e para a 2ª opção.

        É permitido repetir a mesma editora
        nas duas opções.

      </p>

      ${
        comps
          .map(
            comp =>
              compCardHTML(
                comp,
                formState.votos[comp],
                false
              )
          )
          .join('')
      }

    </div>


    <div class="card cat3-card">

      <h3 style="margin-bottom:6px;">

        Categoria 3 — Língua Estrangeira

      </h3>

      <p class="hint" style="margin-top:2px;">

        Todos os professores votam nesta categoria.
        Para cada componente de Língua Estrangeira,
        escolha a 1ª e a 2ª opção.

      </p>

      ${
        CAT3_LABELS
          .map(
            comp =>
              compCardHTML(
                comp,
                formState.votosCat3[comp],
                true
              )
          )
          .join('')
      }

    </div>

  `;


  area
    .querySelectorAll('.pub-btn')
    .forEach(btn=>{

      btn.addEventListener(
        'click',
        ()=>{

          const comp =
            btn.dataset.comp;

          const rank =
            btn.dataset.rank;

          const pub =
            btn.dataset.pub;

          const isCat3 =
            btn.dataset.cat3 === '1';


          const target =
            isCat3
              ? formState.votosCat3[comp]
              : formState.votos[comp];


          target[rank]=pub;


          const row =
            btn.closest('.rank-row');


          row
            .querySelectorAll('.pub-btn')
            .forEach(
              b =>
                b.classList.toggle(
                  'on',
                  b===btn
                )
            );


          updateSubmitArea();

        }
      );

    });


  updateSubmitArea();

}


/* ============================================================
   FORMULÁRIO COMPLETO?
   ============================================================ */

function isFormComplete(){

  if(!formState.nome.trim()){

    return false;

  }

  if(!validaCPF(formState.cpf)){

    return false;

  }

  if(formState.jaVotou){

    return false;

  }

  if(formState.verificandoCPF){

    return false;

  }

  if(!formState.escola){

    return false;

  }

  if(!formState.grupo){

    return false;

  }


  for(
    const comp
    of CAT_COMPONENTS[
      formState.grupo
    ]
  ){

    const vote =
      formState.votos[comp];

    if(
      !vote ||
      !vote.op1 ||
      !vote.op2
    ){

      return false;

    }

  }


  /* Categoria 3 */

  for(
    const comp
    of CAT3_LABELS
  ){

    const vote =
      formState.votosCat3[comp];

    if(
      !vote ||
      !vote.op1 ||
      !vote.op2
    ){

      return false;

    }

  }


  return true;

}


/* ============================================================
   BOTÃO ENVIAR
   ============================================================ */

function updateSubmitArea(){

  const area =
    document.getElementById(
      'submitArea'
    );

  if(!area){

    return;

  }

  const complete =
    isFormComplete();


  area.innerHTML = `

    <div class="card">

      <button
        class="btn-primary"
        id="submitBtn"
        ${complete ? '' : 'disabled'}
      >

        Enviar votação

      </button>

      <div
        id="submitError"
        class="error-box"
      ></div>

    </div>

  `;


  const btn =
    document.getElementById(
      'submitBtn'
    );


  if(btn){

    btn.addEventListener(
      'click',
      submitVote
    );

  }

}


/* ============================================================
   ENVIA VOTO
   ============================================================ */

async function submitVote(){

  const btn =
    document.getElementById(
      'submitBtn'
    );

  const errorBox =
    document.getElementById(
      'submitError'
    );


  if(!isFormComplete()){

    return;

  }


  if(!db){

    mostrarErro(
      errorBox,
      'Firebase não foi inicializado. Verifique o config.js.'
    );

    return;

  }


  try{

    if(btn){

      btn.disabled=true;

      btn.textContent =
        'Registrando voto...';

    }


    /* ----------------------------------------
       Gera hash SHA-256 do CPF
       ---------------------------------------- */

    const voteId =
      await cpfId(
        formState.cpf
      );


    console.log(
      'ID anônimo do voto:',
      voteId
    );


    /* ----------------------------------------
       Documento do voto
       ---------------------------------------- */

    const ref =
      db
        .collection('votos')
        .doc(voteId);


    /* ----------------------------------------
       Verifica novamente no servidor
       ---------------------------------------- */

    const existente =
      await ref.get();


    if(existente.exists){

      formState.jaVotou=true;

      alert(
        'Este CPF já possui um voto registrado.'
      );

      updateSubmitArea();

      return;

    }


    /* ----------------------------------------
       Cria registro
       ---------------------------------------- */

    const record = {

      nome:
        formState.nome
          .trim(),

      escola:
        formState.escola,

      categoriaGrupo:
        String(formState.grupo),

      votosCategoria:
        JSON.parse(
          JSON.stringify(
            formState.votos
          )
        ),

      votosCat3:
        JSON.parse(
          JSON.stringify(
            formState.votosCat3
          )
        ),

      criadoEm:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    };


    console.log(
      'Enviando voto...',
      record
    );


    /*
      IMPORTANTE:

      Não usamos ref.create().

      O Firestore compat usa set().

      create() foi a causa do erro:
      "ref.create is not a function"
    */

    await ref.set(
      record,
      {
        merge:false
      }
    );


    console.log(
      'Voto registrado com sucesso!'
    );


    /* ----------------------------------------
       Sucesso
       ---------------------------------------- */

    document.getElementById(
      'app'
    ).innerHTML = `

      <div class="card success-box">

        <div class="stamp">
          🗳️✅
        </div>

        <h2>
          Voto registrado com sucesso
        </h2>

        <p
          class="hint"
          style="margin-top:8px;"
        >

          Obrigado por participar da
          escolha do livro didático.

        </p>

        <a
          class="link-btn"
          href="resultados.html"
          style="
            display:inline-block;
            margin-top:10px;
          "
        >

          Ver resultados →

        </a>

      </div>

    `;


  }catch(error){

    console.error(
      'ERRO COMPLETO AO REGISTRAR VOTO:',
      error
    );

    console.error(
      'Código:',
      error.code
    );

    console.error(
      'Mensagem:',
      error.message
    );


    let mensagem =
      'Não foi possível registrar o voto.';


    if(error.code === 'permission-denied'){

      mensagem =
        'O Firebase recusou o registro do voto. Verifique as regras do Firestore.';

    }

    else if(
      error.code === 'unavailable'
    ){

      mensagem =
        'O Firebase está temporariamente indisponível. Verifique sua conexão e tente novamente.';

    }

    else if(
      error.message
    ){

      mensagem =
        error.message;

    }


    mostrarErro(
      errorBox,
      mensagem
    );


    if(btn){

      btn.disabled=false;

      btn.textContent =
        'Enviar votação';

    }

  }

}


/* ============================================================
   MOSTRA ERRO
   ============================================================ */

function mostrarErro(
  elemento,
  mensagem
){

  if(!elemento){

    alert(mensagem);

    return;

  }

  elemento.textContent =
    mensagem;

  elemento.style.display='block';

}


/* ============================================================
   INICIA SISTEMA
   ============================================================ */

renderVotar();

</script>
