<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votação — Escolha do Livro Didático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0B3C6B; --blue-700:#12518C; --blue-600:#1568B0;
    --blue-200:#BFE0FA; --blue-100:#DCEEFB; --blue-050:#F2F9FF;
    --white:#FFFFFF; --amber:#F2A93B; --ink:#1F2937; --slate:#5B6B7C;
    --line:#D8E7F5; --ftd:#1568B0; --atica:#C9722A; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--blue-200) 0%,var(--blue-050) 42%,var(--white) 75%);min-height:100vh;}
  h1,h2,h3,h4{font-family:'Manrope',sans-serif;color:var(--blue-900);margin:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;gap:16px;max-width:1000px;margin:0 auto;}
  .logo-slot{width:76px;height:76px;flex:0 0 auto;border-radius:12px;border:1.5px dashed var(--blue-200);
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);overflow:hidden;}
  .logo-slot img{width:100%;height:100%;object-fit:contain;}
  .logo-slot span{font-size:11px;color:var(--slate);text-align:center;line-height:1.3;padding:4px;}
  .titlewrap{text-align:center;flex:1;}
  .titlewrap h1{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .titlewrap p{margin:2px 0 0;color:var(--slate);font-size:13px;}
  nav.linkbar{display:flex;justify-content:center;max-width:1000px;margin:6px auto 0;padding:0 24px;}
  .link-btn{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;
    border:1.5px solid var(--blue-200);background:var(--white);color:var(--blue-700);text-decoration:none;transition:all .15s ease;}
  .link-btn:hover{background:var(--blue-700);border-color:var(--blue-700);color:var(--white);}
  main{max-width:760px;margin:0 auto;padding:24px 20px 80px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;
    box-shadow:0 2px 10px rgba(11,60,107,.05);}
  label{display:block;font-size:13px;font-weight:600;color:var(--blue-900);margin-bottom:6px;}
  input[type=text], select{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;font-size:14px;margin-bottom:16px;background:var(--blue-050);color:var(--ink);}
  input[type=text]:focus, select:focus{outline:2px solid var(--blue-600);outline-offset:1px;background:var(--white);}
  .hint{font-size:12px;color:var(--slate);margin-top:-12px;margin-bottom:16px;}
  .warn{font-size:13px;color:#B23B3B;margin-top:-10px;margin-bottom:14px;}
  .radio-group{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .radio-pill{flex:1 1 220px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s ease;}
  .radio-pill.selected{border-color:var(--blue-600);background:var(--blue-050);}
  .radio-pill b{display:block;font-size:14px;color:var(--blue-900);}
  .radio-pill span{font-size:12px;color:var(--slate);}
  .comp-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--blue-050);}
  .comp-card h4{font-size:15px;margin-bottom:10px;}
  .rank-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .rank-label{font-size:12px;font-weight:700;color:var(--slate);width:66px;flex:0 0 auto;}
  .pub-btn{flex:1;padding:9px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--white);
    font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);
    position:relative;transition:transform .12s ease,border-color .12s ease;}
  .pub-btn:hover{border-color:var(--blue-600);}
  .pub-btn.on{color:var(--white);border-color:transparent;transform:scale(1.03);}
  .pub-btn[data-pub="FTD"].on{background:var(--ftd);}
  .pub-btn[data-pub="Ática"].on{background:var(--atica);}
  .pub-btn.on::after{content:'✓';margin-left:6px;}
  .cat3-card{border-color:var(--amber);background:#FFF8EC;}
  .btn-primary{width:100%;padding:14px;border-radius:10px;border:none;background:var(--blue-700);color:var(--white);
    font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;cursor:pointer;}
  .btn-primary:disabled{background:#A9BCCB;cursor:not-allowed;}
  .btn-primary:hover:not(:disabled){background:var(--blue-900);}
  details{margin-top:6px;}
  summary{cursor:pointer;font-size:13px;color:var(--blue-600);font-weight:600;}
  .school-add{display:flex;gap:8px;margin-top:10px;}
  .school-add input{margin-bottom:0;flex:1;}
  .school-add button{border:none;background:var(--blue-600);color:#fff;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer;}
  .success-box{text-align:center;padding:30px 20px;}
  .stamp{font-size:44px;margin-bottom:10px;}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;text-align:center;}
  footer p{font-size:11px;color:var(--slate);}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-slot" id="logoLeft">
    <img src="imagens/01.png" alt="Logotipo da instituição"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'+ logo-esquerda.png<br>nesta pasta'}))">
  </div>
  <div class="titlewrap">
    <h1>Escolha do Livro Didático</h1>
    <p>Cadastro e votação</p>
  </div>
  <div class="logo-slot" id="logoRight">
    <img src="imagens/02.png" alt="Logotipo da secretaria"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'+ logo-direita.png<br>nesta pasta'}))">
  </div>
</header>

<main id="app"></main>

<footer>
  <p>Sistema de escolha do livro didático PMV/ SME 2027</p>
</footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
<script>
// ---------- Firebase ----------
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// Ativa o cache local (IndexedDB): a página continua funcionando offline,
// leituras usam os dados já em cache e gravações ficam na fila local até
// a conexão voltar, quando são sincronizadas automaticamente.
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  if(err.code === 'failed-precondition'){
    console.warn('Persistência offline não ativada: há outra aba deste site aberta.');
  } else if(err.code === 'unimplemented'){
    console.warn('Este navegador não suporta persistência offline do Firestore.');
  }
});

const PUBLISHERS = ['FTD - A Conquista','Ática - Ápis'];
const CAT_COMPONENTS = {
  1: ['Língua Portuguesa','Matemática','Inter. de Ciên. da Natur. Hist. e Geo.','Educ. Fís.','Educ. Digit. e Midiát.','Arte'],
  2: ['Língua Portuguesa','Matemática','Prod. de texto.','História','Geografia','Arte', 'Hist. e Geo. - Região NE. (Regionalizado)','Educ. Fís.','Educ. Digit. e Midiát.',]
};
const CAT3_LABEL = ['Língua Inglesa 1º e 2º anos', 'Língua Espanhola 1º e 2º anos', 'Língua Inglesa 3º ao 5º anos','Língua Espanhola 3º ao 5º anos',]

const SCHOOLS = [
  'Centro de Educação Infantil Afrânio Samuel',
  'Centro de Educação Infantil Monte Belo',
  'Centro Social Educacional Almir Tavares',
  'Creche Casulo Tia Luiza',
  'Creche Clotilde Wanderley',
  'Creche Maria de Lourdes Monteiro Pontes',
  'Escola Mun. Alfredo Gomes',
  'Escola Mun. Comunidade Cristã',
  'Escola Mun. Dr Benjamin Azevedo',
  'Escola Mun. Jacy Estelita',
  'Escola Mun. José Rufino',
  'Escola Mun. Juvenato Padre Guedes',
  'Escola Mun. Luiz Maranhão',
  'Escola Mun. Luiza Coutinho',
  'Escola Mun. Manoel de Oliveira',
  'Escola Mun. Maria de Lourdes Pedrosa',
  'Escola Mun. Maria José Monteiro',
  'Escola Mun. Napoleão Xavier de Morais',
  'Escola Mun. Urbano Ramos',
  'Grupo Escolar Carlos Pessoa Guerra',
];

let formState = null;
resetFormState();
function resetFormState(){
  formState = { nome:'', cpf:'', escola:'', grupo:null, votos:{}, votosCat3:{op1:null,op2:null}, jaVotou:false };
}

// ---------- storage helpers (Firestore, compartilhado com resultados.html) ----------
// Mapeia a "key" (ex.: 'config:schools', 'voto:12345678900') para um
// documento do Firestore: coleção = parte antes dos ':', id do doc = resto.
function keyToRef(key){
  const [colecao, ...resto] = key.split(':');
  const docId = resto.join(':') || '_default';
  return db.collection(colecao).doc(docId);
}
async function getVal(key, shared=true){
  try{
    const snap = await keyToRef(key).get();
    return snap.exists ? snap.data().value : null;
  }catch(e){ console.error('getVal falhou', key, e); return null; }
}
async function setVal(key, val, shared=true){
  try{
    await keyToRef(key).set({
      value: val,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){ console.error('setVal falhou', key, e); return false; }
}

// ---------- CPF ----------
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function formatCPF(digits){
  digits = digits.slice(0,11);
  let out = digits;
  if(digits.length>9) out = digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  else if(digits.length>6) out = digits.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  else if(digits.length>3) out = digits.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  return out;
}
function validaCPF(digits){
  if(digits.length!==11 || /^(\d)\1{10}$/.test(digits)) return false;
  let soma=0;
  for(let i=0;i<9;i++) soma += parseInt(digits[i])*(10-i);
  let resto = (soma*10)%11; if(resto===10||resto===11) resto=0;
  if(resto!==parseInt(digits[9])) return false;
  soma=0;
  for(let i=0;i<10;i++) soma += parseInt(digits[i])*(11-i);
  resto = (soma*10)%11; if(resto===10||resto===11) resto=0;
  if(resto!==parseInt(digits[10])) return false;
  return true;
}

// ---------- schools ----------
// Cada nome aparece como uma opção no menu de seleção da página de cadastro.
async function getSchools(){
  let list = await getVal('config:schools');
  if(!list || !list.length){ list = SCHOOLS.slice(); await setVal('config:schools', list); }
  return list;
}
async function addSchool(name){
  name = name.trim();
  if(!name) return;
  const list = await getSchools();
  if(!list.includes(name)) list.push(name);
  await setVal('config:schools', list);
}

// ========== VOTAÇÃO ==========
async function renderVotar(){
  const app = document.getElementById('app');
  const schools = await getSchools();

  app.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:16px;">Dados do professor</h3>
      <label for="fNome">Nome completo</label>
      <input type="text" id="fNome" placeholder="Digite seu nome" value="${formState.nome}">

      <label for="fCpf">CPF</label>
      <input type="text" id="fCpf" placeholder="000.000.000-00" value="${formatCPF(formState.cpf)}">
      <div class="warn" id="cpfWarn" style="display:none;"></div>

      <label for="fEscola">Escola em que trabalha</label>
      <select id="fEscola">
        <option value="">Selecione a escola</option>
        ${schools.map(s=>`<option value="${s}" ${formState.escola===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <details>
        <summary>Não encontrou sua escola? Adicionar à lista</summary>
        <div class="school-add">
          <input type="text" id="newSchool" placeholder="Nome da escola">
          <button id="addSchoolBtn" type="button">Adicionar</button>
        </div>
      </details>
      
    </div>

    <div class="card">
      <h3 style="margin-bottom:6px;">Categoria de votação</h3>
      <p class="hint" style="margin-top:2px;">Escolha de acordo com as turmas em que leciona. Quem vota na Categoria 1 não vota na Categoria 2.</p>
      <div class="radio-group">
        <div class="radio-pill" data-grupo="1"><b>Categoria 1</b><span>1º e 2º anos</span></div>
        <div class="radio-pill" data-grupo="2"><b>Categoria 2</b><span>3º, 4º e 5º anos</span></div>
      </div>
    </div>

    <div id="votacaoArea"></div>
    <div id="submitArea"></div>
  `;

  document.getElementById('fNome').addEventListener('input', e=>{ formState.nome = e.target.value; });
  document.getElementById('fCpf').addEventListener('input', e=>{
    const digits = onlyDigits(e.target.value);
    formState.cpf = digits;
    e.target.value = formatCPF(digits);
  });
  document.getElementById('fCpf').addEventListener('blur', checkCpfExistente);
  document.getElementById('fEscola').addEventListener('change', e=>{ formState.escola = e.target.value; });
  document.getElementById('addSchoolBtn').addEventListener('click', async ()=>{
    await addSchool(document.getElementById('newSchool').value);
    renderVotar();
  });

  document.querySelectorAll('.radio-pill').forEach(pill=>{
    pill.classList.toggle('selected', formState.grupo === pill.dataset.grupo);
    pill.addEventListener('click', ()=>{
      formState.grupo = pill.dataset.grupo;
      formState.votos = {};
      CAT_COMPONENTS[formState.grupo].forEach(c=> formState.votos[c] = {op1:null, op2:null});
      document.querySelectorAll('.radio-pill').forEach(p=>p.classList.remove('selected'));
      pill.classList.add('selected');
      renderVotacaoArea();
    });
  });

  renderVotacaoArea();
}

async function checkCpfExistente(){
  const warn = document.getElementById('cpfWarn');
  if(formState.cpf.length!==11){ warn.style.display='none'; return; }
  if(!validaCPF(formState.cpf)){
    warn.textContent = 'CPF inválido. Confira os números digitados.';
    warn.style.display='block';
    formState.jaVotou = false;
    return;
  }
  const existente = await getVal(`voto:${formState.cpf}`);
  if(existente){
    warn.textContent = 'Este CPF já possui um voto registrado no sistema.';
    warn.style.display='block';
    formState.jaVotou = true;
  } else {
    warn.style.display='none';
    formState.jaVotou = false;
  }
  updateSubmitArea();
}

function renderVotacaoArea(){
  const area = document.getElementById('votacaoArea');
  if(!formState.grupo){ area.innerHTML=''; updateSubmitArea(); return; }

  const comps = CAT_COMPONENTS[formState.grupo];
  area.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:6px;">Categoria ${formState.grupo} — por componente curricular</h3>
      <p class="hint" style="margin-top:2px;">Para cada componente, clique na editora escolhida para a 1ª e para a 2ª opção. É permitido repetir a mesma editora nas duas opções.</p>
      ${comps.map(c=>compCardHTML(c, formState.votos[c])).join('')}
    </div>
    <div class="card cat3-card">
      <h3 style="margin-bottom:6px;">Categoria 3 — Língua Estrangeira</h3>
      <p class="hint" style="margin-top:2px;">Todos os professores votam nesta categoria, independente da Categoria 1 ou 2.</p>
      ${compCardHTML(CAT3_LABEL, formState.votosCat3, true)}
    </div>
  `;

  area.querySelectorAll('.pub-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const comp = btn.dataset.comp;
      const rank = btn.dataset.rank;
      const pub = btn.dataset.pub;
      const isCat3 = btn.dataset.cat3 === '1';
      const target = isCat3 ? formState.votosCat3 : formState.votos[comp];
      target[rank] = pub;
      const row = btn.closest('.rank-row');
      row.querySelectorAll('.pub-btn').forEach(b=>b.classList.toggle('on', b===btn));
      btn.animate([{transform:'scale(1.15)'},{transform:'scale(1.03)'}],{duration:180,easing:'ease-out'});
      updateSubmitArea();
    });
  });

  updateSubmitArea();
}

function compCardHTML(label, sel, isCat3){
  const cat3attr = isCat3 ? `data-cat3="1"` : '';
  const compAttr = isCat3 ? '' : `data-comp="${label}"`;
  return `
    <div class="comp-card">
      <h4>${label}</h4>
      ${['op1','op2'].map(rank=>`
        <div class="rank-row">
          <span class="rank-label">${rank==='op1'?'1ª opção':'2ª opção'}</span>
          ${PUBLISHERS.map(pub=>`
            <button type="button" class="pub-btn ${sel[rank]===pub?'on':''}"
              ${compAttr} data-rank="${rank}" data-pub="${pub}" ${cat3attr}>${pub}</button>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function isFormComplete(){
  if(!formState.nome.trim()) return false;
  if(!validaCPF(formState.cpf)) return false;
  if(formState.jaVotou) return false;
  if(!formState.escola) return false;
  if(!formState.grupo) return false;
  for(const c of CAT_COMPONENTS[formState.grupo]){
    const v = formState.votos[c];
    if(!v || !v.op1 || !v.op2) return false;
  }
  if(!formState.votosCat3.op1 || !formState.votosCat3.op2) return false;
  return true;
}

function updateSubmitArea(){
  const area = document.getElementById('submitArea');
  if(!area) return;
  const complete = isFormComplete();
  area.innerHTML = `<div class="card"><button class="btn-primary" id="submitBtn" ${complete?'':'disabled'}>Enviar votação</button></div>`;
  const btn = document.getElementById('submitBtn');
  if(btn) btn.addEventListener('click', submitVote);
}

async function submitVote(){
  const existente = await getVal(`voto:${formState.cpf}`);
  if(existente){
    alert('Este CPF já possui um voto registrado.');
    return;
  }
  const record = {
    nome: formState.nome.trim(),
    cpf: formState.cpf,
    escola: formState.escola,
    categoriaGrupo: formState.grupo,
    votosCategoria: formState.votos,
    votosCat3: formState.votosCat3,
    timestamp: new Date().toISOString()
  };
  const ok = await setVal(`voto:${formState.cpf}`, record);
  const app = document.getElementById('app');
  if(!ok){
    app.innerHTML = `<div class="card"><p class="warn" style="display:block;">Não foi possível registrar o voto agora. Tente novamente.</p></div>`;
    return;
  }
  resetFormState();
  app.innerHTML = `
    <div class="card success-box">
      <div class="stamp">🗳️✅</div>
      <h2>Voto registrado com sucesso</h2>
      <p class="hint" style="margin-top:8px;">Obrigado por participar da escolha do livro didático.</p>
      <a class="link-btn" href="resultados.html" style="display:inline-block;margin-top:10px;">Ver resultados →</a>
    </div>
  `;
}

renderVotar();
</script>
</body>
</html>
