<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Resultados — Escolha do Livro Didático
</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

:root{

  --blue-900:#0B3C6B;
  --blue-700:#12518C;
  --blue-600:#1568B0;

  --blue-200:#BFE0FA;
  --blue-100:#DCEEFB;
  --blue-050:#F2F9FF;

  --white:#FFFFFF;

  --amber:#F2A93B;

  --ink:#1F2937;
  --slate:#5B6B7C;

  --line:#D8E7F5;

  --ftd:#1568B0;
  --atica:#C9722A;

  --radius:14px;

}

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:'Inter',sans-serif;

  color:var(--ink);

  background:
    linear-gradient(
      180deg,
      var(--blue-200) 0%,
      var(--blue-050) 42%,
      var(--white) 75%
    );

  min-height:100vh;

}

h1,
h2,
h3,
h4{

  font-family:'Manrope',sans-serif;

  color:var(--blue-900);

  margin:0;

}

.topbar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:18px 24px;

  gap:16px;

  max-width:1000px;

  margin:0 auto;

}

.logo-slot{

  width:76px;

  height:76px;

  flex:0 0 auto;

  border-radius:12px;

  border:1.5px dashed var(--blue-200);

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.6);

  overflow:hidden;

}

.logo-slot img{

  width:100%;

  height:100%;

  object-fit:contain;

}

.logo-slot span{

  font-size:11px;

  color:var(--slate);

  text-align:center;

  line-height:1.3;

  padding:4px;

}

.titlewrap{

  text-align:center;

  flex:1;

}

.titlewrap h1{

  font-size:22px;

  font-weight:800;

}

.titlewrap p{

  margin:2px 0 0;

  color:var(--slate);

  font-size:13px;

}

nav.linkbar{

  display:flex;

  justify-content:center;

  max-width:1000px;

  margin:6px auto 0;

  padding:0 24px;

}

.link-btn{

  font-family:'Manrope',sans-serif;

  font-weight:700;

  font-size:13px;

  padding:9px 18px;

  border-radius:999px;

  border:1.5px solid var(--blue-200);

  background:var(--white);

  color:var(--blue-700);

  text-decoration:none;

}

.link-btn:hover{

  background:var(--blue-700);

  border-color:var(--blue-700);

  color:var(--white);

}

main{

  max-width:760px;

  margin:0 auto;

  padding:24px 20px 80px;

}

.card{

  background:var(--white);

  border:1px solid var(--line);

  border-radius:var(--radius);

  padding:22px;

  margin-bottom:18px;

  box-shadow:
    0 2px 10px
    rgba(11,60,107,.05);

}

.result-card h3{

  font-size:16px;

  margin-bottom:2px;

}

.result-sub{

  font-size:12px;

  color:var(--slate);

  margin-bottom:14px;

}

.bar-row{

  margin-bottom:10px;

}

.bar-top{

  display:flex;

  justify-content:space-between;

  font-size:12px;

  font-weight:700;

  margin-bottom:4px;

}

.bar-track{

  height:10px;

  border-radius:6px;

  background:var(--blue-100);

  overflow:hidden;

}

.bar-fill{

  height:100%;

  border-radius:6px;

  transition:
    width .4s ease;

}

.rank-block{

  margin-bottom:14px;

}

.rank-block-label{

  font-size:11px;

  font-weight:700;

  color:var(--slate);

  text-transform:uppercase;

  letter-spacing:.04em;

  margin-bottom:6px;

}

.cat-section-title{

  display:flex;

  align-items:center;

  gap:10px;

  margin:26px 0 12px;

}

.cat-section-title h2{

  font-size:17px;

}

.cat-section-title .count{

  font-size:12px;

  color:var(--slate);

  background:var(--blue-100);

  padding:3px 10px;

  border-radius:999px;

}

.cat3-title{

  border-left:3px solid var(--amber);

  padding-left:10px;

}

.empty-note{

  font-size:13px;

  color:var(--slate);

  text-align:center;

  padding:20px;

}

.refresh-note{

  font-size:12px;

  color:var(--slate);

  text-align:center;

  margin-bottom:16px;

}

.error-note{

  background:#FFF4F4;

  border:1px solid #E9B4B4;

  color:#8E2D2D;

  padding:15px;

  border-radius:10px;

  font-size:13px;

}

footer{

  max-width:760px;

  margin:0 auto;

  padding:0 20px 40px;

  text-align:center;

}

footer p{

  font-size:11px;

  color:var(--slate);

}

@media(max-width:600px){

  .topbar{

    padding:14px 12px;

  }

  .logo-slot{

    width:58px;

    height:58px;

  }

  .titlewrap h1{

    font-size:17px;

  }

  .titlewrap p{

    font-size:11px;

  }

  main{

    padding:18px 12px 60px;

  }

  .card{

    padding:17px;

  }

}

</style>

</head>

<body>


<header class="topbar">

  <div class="logo-slot">

    <img
      src="imagens/01.png"
      alt="Logotipo"
    >

  </div>


  <div class="titlewrap">

    <h1>
      Escolha do Livro Didático
    </h1>

    <p>
      Resultados em tempo real
    </p>

  </div>


  <div class="logo-slot">

    <img
      src="imagens/02.png"
      alt="Logotipo"
    >

  </div>

</header>


<nav class="linkbar">

  <a
    class="link-btn"
    href="index.html"
  >

    ← Ir para cadastro e votação

  </a>

</nav>


<main id="app">

  <div class="refresh-note">
    Carregando resultados...
  </div>

</main>


<footer>

  <p>
    Os percentuais são calculados a partir dos votos registrados no Firebase Firestore.
  </p>

</footer>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="config.js"></script>


<script>

'use strict';


/* ============================================================
   FIREBASE
   ============================================================ */

let db;

try{

  firebase.initializeApp(firebaseConfig);

  db =
    firebase.firestore();

  console.log(
    'Firebase inicializado.'
  );

}catch(error){

  console.error(
    'Erro Firebase:',
    error
  );

}


/* ============================================================
   EDITORAS
   ============================================================ */

const PUBLISHERS = [

  'FTD - A Conquista',

  'Ática - Ápis'

];


/* ============================================================
   CATEGORIAS
   ============================================================ */

const CAT_COMPONENTS = {

  1:[
    'Língua Portuguesa',
    'Matemática',
    'Inter. de Ciên. da Natur. Hist. e Geo.',
    'Educ. Fís.',
    'Educ. Digit. e Midiát.',
    'Arte'
  ],

  2:[
    'Língua Portuguesa',
    'Matemática',
    'Prod. de texto.',
    'História',
    'Geografia',
    'Arte',
    'Hist. e Geo. - Região NE. (Regionalizado)',
    'Educ. Fís.',
    'Educ. Digit. e Midiát.'
  ]

};


const CAT3_LABELS = [

  'Língua Inglesa 1º e 2º anos',

  'Língua Espanhola 1º e 2º anos',

  'Língua Inglesa 3º ao 5º anos',

  'Língua Espanhola 3º ao 5º anos'

];


/* ============================================================
   ESTRUTURA DE AGGREGAÇÃO
   ============================================================ */

function createCounts(){

  return {

    'FTD - A Conquista':{

      op1:0,
      op2:0

    },

    'Ática - Ápis':{

      op1:0,
      op2:0

    }

  };

}


function createAggregation(){

  const agg = {

    1:{},

    2:{},

    cat3:{},

    totals:{

      1:0,

      2:0,

      geral:0

    }

  };


  CAT_COMPONENTS[1]
    .forEach(comp=>{

      agg[1][comp] =
        createCounts();

    });


  CAT_COMPONENTS[2]
    .forEach(comp=>{

      agg[2][comp] =
        createCounts();

    });


  CAT3_LABELS
    .forEach(comp=>{

      agg.cat3[comp] =
        createCounts();

    });


  return agg;

}


/* ============================================================
   LÊ VOTOS
   ============================================================ */

async function getVotes(){

  if(!db){

    throw new Error(
      'Firebase não inicializado.'
    );

  }

  const snapshot =
    await db
      .collection('votos')
      .get();

  return snapshot.docs
    .map(doc=>({

      id:doc.id,

      ...doc.data()

    }));

}


/* ============================================================
   CALCULA
   ============================================================ */

function computeResults(votos){

  const agg =
    createAggregation();


  agg.totals.geral =
    votos.length;


  votos.forEach(vote=>{

    const group =
      String(
        vote.categoriaGrupo
      );


    if(
      group === '1'
    ){

      agg.totals[1]++;

    }

    else if(
      group === '2'
    ){

      agg.totals[2]++;

    }


    /* ----------------------------------------
       Categoria 1 e 2
       ---------------------------------------- */

    if(
      vote.votosCategoria &&
      (group === '1' || group === '2')
    ){

      Object.entries(
        vote.votosCategoria
      )
      .forEach(
        ([comp,selection])=>{

          if(
            !agg[group][comp]
          ){

            return;

          }


          if(
            selection &&
            selection.op1 &&
            agg[group][comp][
              selection.op1
            ]
          ){

            agg[group][comp][
              selection.op1
            ].op1++;

          }


          if(
            selection &&
            selection.op2 &&
            agg[group][comp][
              selection.op2
            ]
          ){

            agg[group][comp][
              selection.op2
            ].op2++;

          }

        }
      );

    }


    /* ----------------------------------------
       Categoria 3
       ---------------------------------------- */

    if(
      vote.votosCat3
    ){

      Object.entries(
        vote.votosCat3
      )
      .forEach(
        ([comp,selection])=>{

          /*
             Aqui está a correção principal.

             A Categoria 3 agora possui:

             comp ->
               op1
               op2
          */

          if(
            !agg.cat3[comp]
          ){

            return;

          }


          if(
            selection &&
            selection.op1 &&
            agg.cat3[comp][
              selection.op1
            ]
          ){

            agg.cat3[comp][
              selection.op1
            ].op1++;

          }


          if(
            selection &&
            selection.op2 &&
            agg.cat3[comp][
              selection.op2
            ]
          ){

            agg.cat3[comp][
              selection.op2
            ].op2++;

          }

        }
      );

    }

  });


  return agg;

}


/* ============================================================
   PORCENTAGEM
   ============================================================ */

function pct(
  quantidade,
  total
){

  if(!total){

    return 0;

  }

  return Math.round(
    (
      quantidade /
      total
    ) * 100
  );

}


/* ============================================================
   BARRAS
   ============================================================ */

function barBlockHTML(
  counts,
  total
){

  return [

    'op1',

    'op2'

  ]
  .map(rank=>`

    <div class="rank-block">

      <div class="rank-block-label">

        ${
          rank === 'op1'
            ? '1ª opção'
            : '2ª opção'
        }

      </div>


      ${PUBLISHERS.map(pub=>{

        const quantidade =
          counts[pub][rank];


        const percentual =
          pct(
            quantidade,
            total
          );


        const color =
          pub === 'FTD - A Conquista'
            ? 'var(--ftd)'
            : 'var(--atica)';


        return `

          <div class="bar-row">

            <div class="bar-top">

              <span>
                ${pub}
              </span>

              <span>
                ${percentual}%
                (${quantidade})
              </span>

            </div>


            <div class="bar-track">

              <div
                class="bar-fill"
                style="
                  width:${percentual}%;
                  background:${color};
                "
              ></div>

            </div>

          </div>

        `;

      }).join('')}

    </div>

  `)
  .join('');

}


/* ============================================================
   RENDER
   ============================================================ */

async function renderResultados(){

  const app =
    document.getElementById(
      'app'
    );


  try{

    const votos =
      await getVotes();


    const agg =
      computeResults(votos);


    let html = `

      <p class="refresh-note">

        Atualizado automaticamente ·

        ${agg.totals.geral}

        professor(es) votaram até agora

      </p>

    `;


    /* ========================================================
       CATEGORIAS 1 E 2
       ======================================================== */

    [1,2]
      .forEach(group=>{

        const total =
          agg.totals[group];


        html += `

          <div class="cat-section-title">

            <h2>

              Categoria ${group}

              —

              ${
                group === 1
                  ? '1º e 2º anos'
                  : '3º, 4º e 5º anos'
              }

            </h2>

            <span class="count">

              ${total}
              votante(s)

            </span>

          </div>

        `;


        if(total === 0){

          html += `

            <div class="card empty-note">

              Ainda não há votos registrados
              nesta categoria.

            </div>

          `;

          return;

        }


        CAT_COMPONENTS[group]
          .forEach(comp=>{

            html += `

              <div class="card result-card">

                <h3>
                  ${comp}
                </h3>

                <p class="result-sub">

                  Percentual sobre
                  ${total}
                  votante(s) da Categoria ${group}

                </p>

                ${
                  barBlockHTML(
                    agg[group][comp],
                    total
                  )
                }

              </div>

            `;

          });

      });


    /* ========================================================
       CATEGORIA 3
       ======================================================== */

    html += `

      <div
        class="cat-section-title cat3-title"
      >

        <h2>
          Categoria 3 — Língua Estrangeira
        </h2>

        <span class="count">

          ${agg.totals.geral}
          votante(s)

        </span>

      </div>

    `;


    if(
      agg.totals.geral === 0
    ){

      html += `

        <div class="card empty-note">

          Ainda não há votos registrados.

        </div>

      `;

    }

    else{

      /*
         IMPORTANTE:

         Cada uma das quatro disciplinas
         recebe sua própria apuração.
      */

      CAT3_LABELS
        .forEach(comp=>{

          html += `

            <div class="card result-card">

              <h3>
                ${comp}
              </h3>

              <p class="result-sub">

                Percentual sobre o total geral de
                ${agg.totals.geral}
                professor(es) votante(s)

              </p>

              ${
                barBlockHTML(
                  agg.cat3[comp],
                  agg.totals.geral
                )
              }

            </div>

          `;

        });

    }


    app.innerHTML =
      html;


  }catch(error){

    console.error(
      'Erro ao carregar resultados:',
      error
    );


    app.innerHTML = `

      <div class="card">

        <div class="error-note">

          <strong>
            Não foi possível carregar os resultados.
          </strong>

          <br><br>

          Código:
          ${error.code || 'desconhecido'}

          <br>

          Mensagem:
          ${error.message || 'sem detalhes'}

        </div>

      </div>

    `;

  }

}


/* ============================================================
   ATUALIZA A CADA 6 SEGUNDOS
   ============================================================ */

renderResultados();

setInterval(
  renderResultados,
  6000
);

</script>

</body>

</html>
